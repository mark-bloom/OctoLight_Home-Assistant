name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.9"
            octoprint: "1.11.8"
          - python: "3.10"
            octoprint: "1.11.8"
          - python: "3.12"
            octoprint: "2.0.0rc7"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "OctoPrint==${{ matrix.octoprint }}" ".[develop]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m pytest tests/test_server.py -q
        env:
          OCTOLIGHT_SERVER_TEST: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: distributions
          path: dist/*
